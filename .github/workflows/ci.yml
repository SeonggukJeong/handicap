name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 툴체인 고정 정합(원천 rust-toolchain.toml ↔ 워크플로·Dockerfile 거울). 툴체인 불필요라 맨 앞.
      - name: Toolchain pin consistency
        run: scripts/check-rust-toolchain.sh
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      # `+` 없는 rustc = rust-toolchain.toml로 해석된, cargo가 실제로 쓰는 버전(액션 자체 출력은 `rustc +<ver>`라 공허).
      - name: Effective toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace -- --nocapture
        env:
          RUST_LOG: info

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ui
        run: pnpm lint
      - name: Test
        working-directory: ui
        run: pnpm test
      - name: Build
        working-directory: ui
        env:
          # Vite+Monaco+Recharts 번들이 기본 V8 old-space(~2GiB)로 OOM (deploy/Dockerfile와 동일 처방).
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.0
      - name: Helm lint
        run: helm lint deploy/helm/handicap
      - name: Chart snapshot
        run: ./deploy/helm/handicap/tests/snapshot_test.sh
