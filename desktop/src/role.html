<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모드 전환</title>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --fg: #18181b; --muted: #52525b; --line: #e4e4e7;
    --accent: #4f46e5; --accent-fg: #ffffff; --warn-bg: #fffbeb; --warn-line: #f59e0b;
    --err: #b91c1c; --code-bg: #f4f4f5; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --card: #1c1c1f; --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46;
      --accent: #818cf8; --accent-fg: #111113; --warn-bg: #2a2111; --warn-line: #b45309;
      --err: #f87171; --code-bg: #27272a; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .mode { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  button { font: inherit; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled, input:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
  select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  textarea.cmd { width: 100%; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px; resize: vertical; word-break: break-all; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg);
    padding: 1px 4px; border-radius: 4px; word-break: break-all; }
  .muted { color: var(--muted); }
  .err { color: var(--err); }
  .ok { color: var(--ok); }
  .field { margin: 12px 0; }
  .ips label { display: inline-flex; gap: 6px; align-items: center; margin-right: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .notice { display: flex; gap: 8px; align-items: flex-start; background: var(--warn-bg);
    border: 1px solid var(--warn-line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .notice span { flex: 1; }
  .notice button { padding: 0 8px; border: none; background: transparent; font-size: 16px; line-height: 1.4; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .overlay.on { display: flex; }
  .overlay .box { background: var(--card); color: var(--fg); border-radius: 12px; padding: 24px 28px;
    min-width: 260px; max-width: calc(100vw - 32px); max-height: 100%; overflow-y: auto; text-align: center; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 12px; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #w-state, #w-detail, #w-ident { overflow-wrap: anywhere; }
  #w-state { font-weight: 600; margin: 0 0 4px; }
  #w-detail { margin: 0 0 8px; }
  #w-ident { font-size: 12px; margin: 8px 0 0; }
  #code { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }
  #code.shown { white-space: normal; word-break: break-all; text-overflow: clip; }
  @media (max-width: 560px) { #code.shown { flex-basis: 100%; } }
  details > summary { cursor: pointer; font-weight: 600; }
  details[open] > summary { margin-bottom: 8px; }
  textarea.codein { width: 100%; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code-bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px; resize: vertical; word-break: break-all; }
  #confirm-text p { margin: 0 0 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app">
  <h1>모드 전환</h1>
  <div id="notices"></div>
  <p id="err" class="err" hidden></p>
  <section class="card">
    <p id="mode" class="mode" hidden></p>
    <div class="row">
      <button id="switch" class="primary" type="button" hidden></button>
      <button id="switch-server" type="button" hidden>서버로 열기</button>
      <button id="back" type="button" hidden>화면으로 돌아가기</button>
    </div>
  </section>
  <section id="worker" class="card" hidden>
    <h2>부하기 상태</h2>
    <p id="w-state"></p>
    <p id="w-detail" class="muted"></p>
    <div class="row">
      <button id="w-disconnect" type="button" hidden>접속 끊기</button>
      <button id="w-reconnect" type="button" hidden>다시 접속</button>
    </div>
    <p id="w-ident" class="muted"></p>
  </section>
  <section id="server" class="card" hidden>
    <div class="field">
      <h2>부하기 PC 접속 코드</h2>
      <div class="row">
        <div id="code"></div>
        <button id="code-copy" type="button" disabled>복사</button>
        <button id="code-show" type="button" aria-label="접속 코드 보기" disabled>보기</button>
        <span id="code-copy-msg" role="status"></span>
      </div>
      <p id="code-err" class="err" hidden></p>
      <p class="muted">부하기 PC의 앱에서 「모드 전환」 → 「부하기로 접속」에 붙여넣으세요 — 같은 버전의 앱이어야 합니다</p>
    </div>
    <div class="field">
      <p id="ip-public" class="err" hidden>사설 망 주소가 아닙니다 — 이 주소는 바깥 망에 드러날 수 있습니다</p>
      <p id="plaintext" class="muted">연결은 암호화되지 않습니다 — 회사 망에서만 쓰세요. 부하기 PC는 테스트의 환경 값(비밀 포함)을 받습니다.</p>
    </div>
    <details id="cmd-box" class="field">
      <summary>명령으로 붙이기 (포터블 exe·터미널)</summary>
      <div class="field">
        <h2>이 PC의 IP</h2>
        <div id="ips" class="ips"></div>
        <p id="no-ip" class="muted" hidden>이 PC의 망 주소를 찾지 못했습니다</p>
      </div>
      <div class="field">
        <h2><label for="os">부하기 PC의 OS</label></h2>
        <select id="os">
          <option value="windows">Windows</option>
          <option value="macos">macOS</option>
          <option value="linux">Linux</option>
        </select>
      </div>
      <div class="field">
        <textarea id="cmd" class="cmd" rows="3" readonly aria-label="부하기 PC용 명령"></textarea>
        <div class="row" style="margin-top:6px">
          <button id="copy" type="button">부하기 PC용 명령 복사</button>
          <button id="cmd-show" type="button" disabled>토큰 보기</button>
          <span id="copy-msg" role="status"></span>
        </div>
        <p id="cmd-err" class="err" hidden></p>
        <p id="os-guide" class="muted"></p>
      </div>
    </details>
    <div class="field">
      <label class="row"><input id="sw" type="checkbox"> 이 PC도 부하 내기</label>
      <p id="sw-note" class="muted" hidden></p>
    </div>
    <div class="field">
      <p id="firewall" class="muted"></p>
    </div>
  </section>
  <section class="card">
    <details id="join">
      <summary>부하기로 접속</summary>
      <textarea id="code-in" class="codein" rows="3" aria-label="접속 코드" spellcheck="false" autocomplete="off"></textarea>
      <p class="muted">서버 PC의 「모드 전환」 화면에서 복사한 접속 코드를 붙여넣으세요</p>
      <div class="row">
        <button id="join-btn" type="button">부하기로 접속</button>
      </div>
      <p id="join-err" class="err" hidden></p>
    </details>
  </section>
</main>
<div id="confirm" class="overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
  <div class="box">
    <div id="confirm-text"></div>
    <div class="row" style="justify-content:center">
      <button id="confirm-ok" class="primary" type="button">중단하고 전환</button>
      <button id="confirm-cancel" type="button">취소</button>
    </div>
  </div>
</div>
<div id="busy" class="overlay" aria-busy="true" role="status">
  <div class="box"><div class="spinner"></div><p id="busy-text"></p></div>
</div>
<script>
if (window.top !== window.self) { document.documentElement.textContent = ""; throw new Error("framed"); }
(function () {
  "use strict";
  var I = window.__TAURI_INTERNALS__;
  function invoke(cmd, args) {
    if (!I || typeof I.invoke !== "function") return Promise.reject("셸 연결이 없습니다");
    return I.invoke(cmd, args || {});
  }
  function $(id) { return document.getElementById(id); }
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function errText(e) { return typeof e === "string" ? e : (e && e.message) || String(e); }

  var OS_GUIDE = {
    windows: [["같은 버전의 포터블 exe를 받아 두고 그 폴더의 PowerShell에 붙여넣으세요"]],
    macos: [["같은 버전의 앱을 응용 프로그램 폴더에 설치하고 한 번 열어 허용한 뒤(또는 "],
            ["xattr -dr com.apple.quarantine /Applications/Handicap.app", true],
            [") 터미널에 붙여넣으세요"]],
    linux: [["AppImage 폴더에서 붙여넣으세요(실행 권한 필요)"]]
  };
  function firewallGuide(os, port) {
    if (os === "windows") return [["처음에 묻는 「액세스 허용」을 눌러 주세요 — 놓쳤다면 docs/dev/lan-workers.md §1"]];
    if (os === "macos") return [["「들어오는 네트워크 연결을 허용하겠습니까?」 창이 뜨면 허용을 눌러 주세요"]];
    return [["방화벽(ufw)을 쓰고 있다면 "], ["sudo ufw allow " + port + "/tcp", true]];
  }
  function fill(el, parts) {
    el.textContent = "";
    parts.forEach(function (p) {
      if (p[1]) { var c = document.createElement("code"); c.textContent = p[0]; el.appendChild(c); }
      else el.appendChild(document.createTextNode(p[0]));
    });
  }

  var cur = null;          // 마지막 role_state
  var overlayOn = false;   // 전환 덮개
  var confirmOpen = false;
  var selIp = null, selOs = null, ipsKey = null, cmdKey = null;
  var swPending = false, swErr = "";

  function noticeList(st) {
    var n = st.notices, out = [];
    if (n.port_changed) out.push(["port_changed", "부하기 접속 포트 " + n.port_changed[0] + "을 다른 프로그램이 쓰고 있어 " + n.port_changed[1] + "로 열었습니다 — 부하기들에 새 접속 코드(또는 명령)를 주세요"]);
    if (n.worker_code_unreadable) out.push(["worker_code_unreadable", "저장된 접속 코드를 읽지 못했습니다 — 새 코드를 붙여넣어 주세요"]);
    if (n.save_failed) out.push(["save_failed", "역할을 저장하지 못했습니다 — 다음 실행 때 이전 역할로 열립니다"]);
    if (n.self_worker_excluded) out.push(["self_worker_excluded", "워커 화면에서 이 PC를 제외해 꺼졌습니다"]);
    if (n.config_warning) out.push(["config_warning", "저장된 역할 설정을 읽지 못해 혼자 쓰기로 열었습니다"]);
    if (n.start_error != null) out.push(["start_error", "서버로 열지 못했습니다: " + n.start_error]);
    return out;
  }

  // 본문(#app) 컨트롤만 잠근다 — 확인 상자(#confirm)의 버튼은 건드리지 않는다.
  function setAllDisabled(on) {
    document.querySelectorAll("#app button, #app input, #app select, #app textarea:not([readonly])").forEach(function (el) {
      if (on) el.disabled = true;
    });
  }

  // errSrc: "refresh"(상태 조회 실패 — 다음 조회가 성공하면 지움) | "switch"(전환 실패 — 다음 전환 때 지움)
  var errSrc = null;
  function showErr(msg, src) {
    var e = $("err"); e.textContent = msg; e.hidden = !msg;
    errSrc = msg ? (src || null) : null;
  }

  function render(st) {
    cur = st;
    var locked = overlayOn || st.switching;

    // 안내
    var box = $("notices");
    box.textContent = "";
    noticeList(st).forEach(function (it) {
      var d = document.createElement("div"); d.className = "notice"; d.setAttribute("role", "alert");
      var s = document.createElement("span"); s.textContent = it[1];
      var b = document.createElement("button"); b.type = "button"; b.textContent = "✕";
      b.setAttribute("aria-label", "안내 닫기"); b.disabled = locked;
      b.addEventListener("click", function () {
        invoke("dismiss_notice", { kind: it[0] }).catch(function () {}).then(refresh);
      });
      d.appendChild(s); d.appendChild(b); box.appendChild(d);
    });

    // 현재 모드 · 버튼 (컨트롤러가 떠 있을 때만 "열려 있음"을 말한다)
    var isWorker = st.role === "worker";
    var mode = $("mode");
    mode.hidden = !isWorker && !st.app_url;
    mode.textContent = isWorker ? "현재 모드: 부하기 (서버가 보내는 테스트를 실행합니다)"
      : st.role === "server" ? "현재 모드: 서버로 열려 있음" : "현재 모드: 혼자 쓰기 (이 PC만 부하를 냅니다)";
    var sw = $("switch");
    sw.hidden = false;
    sw.textContent = st.role === "local" ? "서버로 열기" : "혼자 쓰기로 돌아가기";
    sw.disabled = locked;
    var sws = $("switch-server");
    sws.hidden = !isWorker;
    sws.disabled = locked;
    $("back").hidden = isWorker || !st.app_url;
    $("back").disabled = locked;

    // 부하기 영역
    $("worker").hidden = !isWorker;
    if (isWorker) renderWorker(st, locked);

    // 접속 코드 입력 (모든 역할) — 요소를 다시 만들지 않는다(입력·열림 상태 유지)
    $("join").querySelector("summary").textContent = isWorker ? "다른 접속 코드로 바꾸기" : "부하기로 접속";
    $("code-in").disabled = locked;
    $("join-btn").disabled = locked;

    // 서버 영역
    var server = st.role === "server" && !!st.app_url;
    $("server").hidden = !server;
    if (server) renderServer(st, locked);
    else {
      if (codeVal || codeKey) { codeVal = ""; codeKey = null; $("code-err").hidden = true; }
      codeShown = false; cmdShown = false; paintCode(); paintCmd();
    }

    if (locked) setAllDisabled(true);
  }

  // 서버가 보낸 글자는 <bdi>의 textContent로만 넣는다.
  // parts: 문자열(그대로) | { b: 서버 글자 }
  function setParts(el, parts) {
    el.textContent = "";
    parts.forEach(function (p) {
      if (typeof p === "string") { el.appendChild(document.createTextNode(p)); return; }
      var b = document.createElement("bdi"); b.textContent = p.b; el.appendChild(b);
    });
  }
  var REASON = {
    unreachable: "서버에 연결할 수 없습니다 — 서버 PC가 켜져 있고 서버 모드인지, 방화벽이 막지 않는지 확인해 주세요",
    auth_failed: "접속 코드의 토큰이 맞지 않습니다 — 서버 화면에서 새 코드를 받아 주세요",
    protocol: "서버와 통신하지 못했습니다 — 두 PC의 앱 버전이 같은지 확인해 주세요"
  };
  function renderWorker(st, locked) {
    var w = st.worker;
    if (!w) return;
    var s = [], dt = [];
    var addr = w.addr ? [{ b: w.addr }] : [];
    if (w.state === "connecting") {
      s = ["서버에 연결하는 중…"];
      w.servers.forEach(function (sv, i) { if (i) dt.push(", "); dt.push({ b: sv }); });
    } else if (w.state === "idle") {
      s = ["연결됨 · 대기 중"]; dt = addr;
    } else if (w.state === "running") {
      s = ["테스트 실행 중"];
      if (w.scenario_name) { s.push(" · "); s.push({ b: w.scenario_name }); }
      if (w.run_tail) { s.push(" · #"); s.push({ b: w.run_tail }); }
      dt = addr;
    } else if (w.state === "retrying") {
      s = ["다시 시도 중"];
      if (w.reason === "rejected") { s.push(" — 서버가 접속을 거절했습니다: "); s.push({ b: w.reason_detail || "" }); }
      else if (REASON[w.reason]) s.push(" — " + REASON[w.reason]);
      dt = [w.retry_in_secs ? w.retry_in_secs + "초 뒤 다시 시도" : "다시 시도하는 중…"];
    } else if (w.state === "excluded") {
      s = ["서버에서 제외됨 — 서버 「워커」 화면에서 제외했습니다"];
    } else {
      s = ["접속 끊김"];
    }
    setParts($("w-state"), s);
    setParts($("w-detail"), dt);
    setParts($("w-ident"), ["이 PC: ", { b: st.hostname }].concat(st.install_id ? [" · 워커 ID ", { b: st.install_id }] : []));
    var live = w.state === "connecting" || w.state === "idle" || w.state === "running" || w.state === "retrying";
    $("w-disconnect").hidden = !live;
    $("w-disconnect").disabled = locked;
    $("w-reconnect").hidden = live || w.servers.length === 0;
    $("w-reconnect").disabled = locked;
  }

  function renderServer(st, locked) {
    var key = st.ips.join(",");
    if (key !== ipsKey) {
      ipsKey = key;
      if (st.ips.indexOf(selIp) < 0) selIp = st.ips.length ? st.ips[0] : null;
      var box = $("ips"); box.textContent = "";
      st.ips.forEach(function (ip) {
        var l = document.createElement("label");
        var r = document.createElement("input"); r.type = "radio"; r.name = "ip"; r.value = ip;
        r.checked = ip === selIp;
        r.addEventListener("change", function () { selIp = ip; updateCommand(); });
        l.appendChild(r); l.appendChild(document.createTextNode(ip)); box.appendChild(l);
      });
    }
    document.querySelectorAll('input[name="ip"]').forEach(function (r) { r.disabled = locked; });
    $("no-ip").hidden = st.ips.length > 0;
    $("ip-public").hidden = !(st.ips_public_fallback && st.ips.length > 0);

    if (selOs == null) { selOs = st.server_os; $("os").value = selOs; }
    $("os").disabled = locked;
    fill($("os-guide"), OS_GUIDE[selOs] || []);
    fill($("firewall"), firewallGuide(st.server_os, st.grpc_port));

    $("copy").disabled = locked || !cmdVal;
    $("cmd-show").disabled = locked || !cmdVal;
    updateCommand();
    updateCode(st);
    $("code-copy").disabled = locked || !codeVal;
    $("code-show").disabled = locked || !codeVal;

    // 이 PC도 부하 내기
    var cb = $("sw"), note = $("sw-note");
    if (!swPending) cb.checked = st.self_worker;
    var why = "";
    if (st.self_worker_busy) why = "이 PC가 테스트를 실행하는 중이라 끝난 뒤 바꿀 수 있습니다";
    cb.disabled = locked || swPending || !!why;
    var noteText = why || swErr;
    note.textContent = noteText; note.hidden = !noteText;
    note.className = why ? "muted" : "err";
  }

  // 접속 코드는 요청형 IPC로만 받는다. console·오류 줄에 쓰지 않는다.
  // 코드와 명령은 토큰을 담는다 — 화면(DOM)에는 「보기」를 누르거나 복사가 실패했을 때만 원문을 둔다.
  var MASK = "••••••••••••";
  var codeKey = null, codeVal = "", codeShown = false;
  var cmdVal = "", cmdShown = false;
  function paintCode() {
    var el = $("code"), b = $("code-show");
    var show = codeShown && !!codeVal;
    el.textContent = codeVal ? (show ? codeVal : codeVal.slice(0, codeVal.indexOf("-") + 1) + MASK) : "";
    el.classList.toggle("shown", show);
    b.textContent = codeShown ? "가리기" : "보기";
    b.setAttribute("aria-label", codeShown ? "접속 코드 가리기" : "접속 코드 보기");
  }
  function paintCmd() {
    $("cmd").value = cmdShown ? cmdVal : cmdVal.replace(/(--token )\S+/, "$1" + MASK.slice(0, 8));
    $("cmd-show").textContent = cmdShown ? "토큰 가리기" : "토큰 보기";
  }
  function updateCode(st) {
    var key = st.ips.join(",") + "|" + st.grpc_port;
    if (key === codeKey) return;
    codeKey = key;
    invoke("connect_code").then(function (text) {
      if (codeKey !== key) return;
      codeVal = text; paintCode(); $("code-err").hidden = true;
      var lk = overlayOn || !!(cur && cur.switching);
      $("code-copy").disabled = lk; $("code-show").disabled = lk;
    }, function (e) {
      if (codeKey !== key) return;
      codeKey = null; codeVal = ""; paintCode();
      $("code-copy").disabled = true; $("code-show").disabled = true;
      $("code-err").textContent = errText(e); $("code-err").hidden = false;
    });
  }

  function updateCommand() {
    var st = cur;
    if (!st) return;
    var cerr = $("cmd-err");
    if (!selIp) {
      cmdKey = null; cmdVal = ""; paintCmd(); cerr.hidden = true;
      $("copy").disabled = true; $("cmd-show").disabled = true;
      return;
    }
    var key = selIp + "|" + selOs + "|" + st.grpc_port;
    if (key === cmdKey) return;
    cmdKey = key;
    invoke("worker_command", { ip: selIp, os: selOs }).then(function (text) {
      if (cmdKey !== key) return;
      cmdVal = text; paintCmd(); cerr.hidden = true;
      var lk = overlayOn || !!(cur && cur.switching);
      $("copy").disabled = lk; $("cmd-show").disabled = lk;
    }, function (e) {
      if (cmdKey !== key) return;
      cmdKey = null; cmdVal = ""; paintCmd();
      $("copy").disabled = true; $("cmd-show").disabled = true;
      cerr.textContent = errText(e); cerr.hidden = false;
    });
  }

  function refresh() {
    return invoke("role_state").then(function (st) {
      if (errSrc === "refresh") showErr("");
      render(st);
    }, function (e) { showErr(errText(e), "refresh"); });
  }

  // 복사: 클릭 → navigator.clipboard.writeText → 숨은 textarea + execCommand("copy")
  function copyFallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  var copyTimers = {};
  // fail: { what: "코드를"|"명령을", reveal: 원문을 펼쳐 선택하는 함수 } — 직접 복사할 수 있게 한다.
  function copyMsg(msgId, ok, fail) {
    var m = $(msgId);
    clearTimeout(copyTimers[msgId]);
    if (ok) {
      m.className = "ok"; m.textContent = "복사됨";
      copyTimers[msgId] = setTimeout(function () { m.textContent = ""; }, 2000);
    } else {
      fail.reveal();
      m.className = "err"; m.textContent = "복사하지 못했습니다 — 선택된 " + fail.what + " 직접 복사하세요";
    }
  }
  function doCopy(text, msgId, fail) {
    if (!text) return;
    var p;
    try {
      p = navigator.clipboard && navigator.clipboard.writeText
        ? navigator.clipboard.writeText(text) : Promise.reject("no clipboard");
    } catch (e) { p = Promise.reject(e); }
    p.then(function () { copyMsg(msgId, true); }, function () { copyMsg(msgId, copyFallback(text), fail); });
  }
  $("copy").addEventListener("click", function () {
    doCopy(cmdVal, "copy-msg", { what: "명령을", reveal: function () {
      cmdShown = true; paintCmd();
      var c = $("cmd"); c.focus(); c.select();
    } });
  });
  $("code-copy").addEventListener("click", function () {
    doCopy(codeVal, "code-copy-msg", { what: "코드를", reveal: function () {
      codeShown = true; paintCode();
      var r = document.createRange(); r.selectNodeContents($("code"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    } });
  });
  $("code-show").addEventListener("click", function () { codeShown = !codeShown; paintCode(); });
  $("cmd-show").addEventListener("click", function () { cmdShown = !cmdShown; paintCmd(); });

  $("os").addEventListener("change", function () {
    selOs = $("os").value;
    if (cur) render(cur);
  });

  $("sw").addEventListener("change", function () {
    var want = $("sw").checked;
    swPending = true; swErr = "";
    if (cur) render(cur);
    invoke("set_self_worker", { enabled: want }).then(function () { swErr = ""; }, function (e) { swErr = errText(e); })
      .then(function () { swPending = false; return refresh(); });
  });

  $("back").addEventListener("click", function () {
    if (cur && cur.app_url) location.assign(cur.app_url);
  });

  // lines: 줄마다 <p>(textContent). okLabel: 확인 버튼 글자.
  function askConfirm(lines, okLabel) {
    return new Promise(function (resolve) {
      if (confirmOpen) { resolve(false); return; }
      confirmOpen = true;
      var box = $("confirm-text");
      box.textContent = "";
      lines.forEach(function (l) {
        var p = document.createElement("p"); p.textContent = l; box.appendChild(p);
      });
      var dlg = $("confirm"), ok = $("confirm-ok"), cancel = $("confirm-cancel");
      ok.textContent = okLabel;
      ok.disabled = false; cancel.disabled = false;
      dlg.classList.add("on");
      cancel.focus();
      function done(v) {
        dlg.classList.remove("on"); confirmOpen = false;
        ok.removeEventListener("click", yes);
        cancel.removeEventListener("click", no);
        document.removeEventListener("keydown", onKey, true);
        resolve(v);
      }
      function yes() { done(true); }
      function no() { done(false); }
      // Esc = 취소, Tab/Shift+Tab은 두 버튼 사이에서만 돈다.
      function onKey(ev) {
        if (ev.key === "Escape") { ev.preventDefault(); no(); return; }
        if (ev.key === "Tab") {
          ev.preventDefault();
          (document.activeElement === cancel ? ok : cancel).focus();
        }
      }
      ok.addEventListener("click", yes);
      cancel.addEventListener("click", no);
      document.addEventListener("keydown", onKey, true);
    });
  }

  function setOverlay(text) {
    overlayOn = !!text;
    $("busy-text").textContent = text || "";
    $("busy").classList.toggle("on", overlayOn);
    $("app").setAttribute("aria-busy", overlayOn ? "true" : "false");
    if (overlayOn) setAllDisabled(true);
  }

  var STOP_LINE = "실행 중인 테스트가 중단됩니다 — 다른 부하기도 함께 멈춥니다";
  // 부하기 역할이 테스트를 돌리는 중인지 — 최신 상태를 새로 읽는다.
  function workerRunning() {
    return invoke("role_state").then(function (st) {
      return !!(st.worker && st.worker.state === "running");
    });
  }

  // 덮개 + 동작 + 최소 600ms. 실패 사유는 화면 한 줄(코드는 사유에 없다).
  // opts: { prefix: 실패 문구 머리, serverStart: 서버로 여는 전환(셸 안내가 사유를 세우면 줄을 생략) }
  function runWithOverlay(text, fn, onDone, opts) {
    opts = opts || {};
    setOverlay(text);
    return Promise.allSettled([fn(), delay(600)]).then(function (rs) {
      setOverlay("");
      cmdKey = null; ipsKey = null; codeKey = null;
      var failed = rs[0].status === "rejected";
      return refresh().then(function () {
        if (onDone) onDone(!failed);
        if (!failed) return;
        // 서버로의 실패는 셸이 「서버로 열지 못했습니다」 안내를 세운다 — 사유는 한 번만.
        if (opts.serverStart && cur && cur.notices.start_error != null) return;
        showErr((opts.prefix || "전환하지 못했습니다: ") + errText(rs[0].reason), "switch");
      });
    });
  }
  // 확인 전 비동기 읽기 동안 두 번째 클릭이 같은 흐름을 또 시작하지 못하게 한다.
  var flowBusy = false;
  function endFlow() { flowBusy = false; }
  function failTop(e) {
    showErr("전환하지 못했습니다: " + errText(e), "switch");
    return refresh();
  }

  // 역할 전환 (혼자 쓰기 ↔ 서버, 부하기에서 둘 다)
  function switchTo(target) {
    if (!cur || overlayOn || flowBusy) return;
    flowBusy = true;
    showErr("");
    var ask;
    if (cur.role === "worker") {
      ask = workerRunning().then(function (r) {
        return r ? askConfirm([STOP_LINE], "중단하고 전환") : true;
      });
    } else {
      ask = invoke("active_run_count").then(function (n) {
        return n > 0 ? askConfirm(["실행 중인 테스트 " + n + "개가 중단됩니다"], "중단하고 전환") : true;
      });
    }
    ask.then(function (go) {
      if (!go) return;
      return runWithOverlay(target === "server" ? "서버 모드로 전환 중…" : "혼자 쓰기로 돌아가는 중…",
        function () { return invoke("switch_role", { target: target }); }, null, { serverStart: target === "server" });
    }, failTop).then(endFlow, endFlow);
  }
  $("switch").addEventListener("click", function () {
    if (!cur) return;
    switchTo(cur.role === "local" ? "server" : "local");
  });
  $("switch-server").addEventListener("click", function () { switchTo("server"); });

  $("w-disconnect").addEventListener("click", function () {
    if (!cur || overlayOn || flowBusy) return;
    flowBusy = true;
    showErr("");
    workerRunning().then(function (r) {
      return r ? askConfirm([STOP_LINE], "중단하고 끊기") : true;
    }).then(function (go) {
      if (!go) return;
      return runWithOverlay("접속을 끊는 중…", function () { return invoke("disconnect_worker"); }, null,
        { prefix: "접속을 끊지 못했습니다: " });
    }, function (e) { showErr("접속을 끊지 못했습니다: " + errText(e), "switch"); return refresh(); }).then(endFlow, endFlow);
  });
  $("w-reconnect").addEventListener("click", function () {
    if (!cur || overlayOn) return;
    showErr("");
    runWithOverlay("다시 접속하는 중…", function () { return invoke("reconnect_worker"); }, null,
      { prefix: "다시 접속하지 못했습니다: " });
  });

  // 부하기로 접속: 코드 검사 → 확인 → 접속. 코드 글자는 어디에도 되풀이하지 않는다.
  $("join-btn").addEventListener("click", function () {
    if (!cur || overlayOn || confirmOpen || flowBusy) return;
    flowBusy = true;
    var code = $("code-in").value;
    var err = $("join-err");
    err.hidden = true; showErr("");
    var isWorker = cur.role === "worker";
    invoke("check_code", { code: code }).then(function (pv) {
      var lines = ["이 서버에 부하기로 접속합니다: " + pv.ips.map(function (ip) { return ip + ":" + pv.port; }).join(", ") + " — 이 서버가 보내는 테스트를 이 PC가 실행합니다"];
      lines.push("믿을 수 있는 서버의 코드만 붙여넣으세요 — 서버가 정한 주소로 이 PC가 요청을 보냅니다(이 PC가 닿는 사내 주소 포함)");
      if (pv.non_private) lines.push("사설 망 주소가 아닙니다 — 회사 망 밖의 서버일 수 있습니다");
      var extra;
      if (!isWorker) {
        lines.push("이 PC의 시나리오 화면·예약 실행·운영 모니터가 멈춥니다(다른 역할로 돌아오면 다시 켜집니다)");
        extra = invoke("active_run_count").then(function (n) {
          if (n > 0) lines.push("실행 중인 테스트 " + n + "개가 중단됩니다");
        });
      } else {
        extra = workerRunning().then(function (r) { if (r) lines.push(STOP_LINE); });
      }
      return extra.then(function () {
        return askConfirm(lines, "접속");
      }).then(function (go) {
        if (!go) return;
        return runWithOverlay("부하기로 접속하는 중…", function () { return invoke("connect_worker", { code: code }); },
          function (okd) {
            if (!okd) return;
            $("code-in").value = ""; $("join").open = false;
          });
      });
    }).catch(function (e) {
      err.textContent = errText(e); err.hidden = false;
    }).then(endFlow, endFlow);
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !overlayOn) refresh();
  });
  // 1초 간격 하나: 부하기 역할은 매 틱, 서버 역할·전환 중은 3틱마다(3초).
  var tick = 0;
  setInterval(function () {
    tick++;
    if (!cur || document.hidden || overlayOn || confirmOpen || swPending) return;
    if (cur.role === "worker" || ((cur.role === "server" || cur.switching) && tick % 3 === 0)) refresh();
  }, 1000);
  refresh();
})();
</script>
</body>
</html>
